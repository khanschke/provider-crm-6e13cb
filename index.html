<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Provider CRM</title>
    <link rel="stylesheet" href="assets/styles/salesforce-lightning-design-system.min.css" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <!-- ===== Salesforce global header (standard) ===== -->
    <header class="lx-gheader">
        <a class="lx-logo" href="#/portfolio" title="Humana">
            <img class="lx-humana-logo" src="assets/img/humana-logo.png" alt="Humana" />
        </a>
        <div class="lx-gsearch">
            <svg class="lx-gsearch__ico slds-icon" aria-hidden="true"><use xlink:href="assets/icons/utility-sprite/svg/symbols.svg#search"></use></svg>
            <input type="text" placeholder="Search..." />
        </div>
        <div class="lx-utils">
            <button class="lx-uicon" title="Assistant"><img class="lx-uimg" src="assets/icons/util/astro.png" alt="Assistant" /></button>
            <button class="lx-uicon lx-fav" title="Favorites"><img class="lx-uimg lx-uimg--pill" src="assets/icons/util/fav.png" alt="Favorites" /></button>
            <button class="lx-uicon" title="Global Actions"><img class="lx-uimg" src="assets/icons/util/add.png" alt="Global Actions" /></button>
            <button class="lx-uicon" title="Salesforce Mobile"><img class="lx-uimg" src="assets/icons/util/mobile.png" alt="Salesforce Mobile" /></button>
            <button class="lx-uicon" title="Help"><img class="lx-uimg" src="assets/icons/util/help.png" alt="Help" /></button>
            <button class="lx-uicon" title="Setup"><img class="lx-uimg" src="assets/icons/util/setup.png" alt="Setup" /></button>
            <button class="lx-uicon" title="Notifications"><img class="lx-uimg" src="assets/icons/util/bell.png" alt="Notifications" /></button>
            <span class="lx-avatar" title="Logged in"><img src="assets/img/avatar.jpg" alt="Profile" /></span>
        </div>
    </header>

    <!-- ===== App navigation bar ===== -->
    <nav class="lx-appnav">
        <button class="lx-waffle" title="App Launcher" aria-label="App Launcher">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </button>
        <span class="lx-app">Provider CRM</span>
        <ul class="lx-tabs" id="lx-tabs"></ul>
        <button class="lx-edit" title="Edit Page"><svg class="slds-icon" aria-hidden="true"><use xlink:href="assets/icons/utility-sprite/svg/symbols.svg#edit"></use></svg></button>
    </nav>

    <!-- ===== Page content ===== -->
    <main id="app" class="lx-main"></main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
